[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-analyst"
version = "0.1.0"
description = "AI-powered Data Analyst using LangChain, LangGraph, and Ollama"
authors = [
    {name = "Gaurav"}
]
requires-python = ">=3.10"

dependencies = [
    "langchain==1.3.7",
    "langchain-core==1.4.3",
    "langchain-ollama==1.1.0",
    "langchain-community==0.4.2",
    "langgraph==1.2.4",
    "langgraph-checkpoint==4.1.1",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "matplotlib==3.10.9",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "ollama==0.6.2",
    "seaborn==0.13.2",
    "nbformat==5.10.4",
    "toml==0.10.2"
]